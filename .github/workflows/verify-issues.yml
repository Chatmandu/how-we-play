name: Verify How We Play issues

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-build:
    name: Content, publishing gate and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run diagram, content and publishing gate tests
        run: npm test

      - name: Check public build excludes draft formations
        run: npm run build:public

      - name: Check preview build includes drafts safely
        run: npm run build:preview
